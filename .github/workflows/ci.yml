name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm ci

      - name: 前端单元测试 (Vitest)
        run: npm test

      # dist 必须先生成:tauri 的 generate_context! 在编译期嵌入前端产物
      - name: 前端构建
        run: npm run build

      # .cargo/config.toml 仅配置 gnu target 链接器,对 CI 默认的 msvc 宿主构建不生效
      - name: Rust 构建 (cargo build)
        run: cargo build --manifest-path src-tauri/Cargo.toml

      # 本项目**不启用 rustfmt**(全量格式化会重排大量既有代码、污染 git blame,见 AGENTS.md §5 P103)
      - name: Rust 静态检查 (cargo clippy -D warnings)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust 测试 (cargo test)
        run: cargo test --manifest-path src-tauri/Cargo.toml
